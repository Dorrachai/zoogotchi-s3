name: Release Firmware

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build & verification dependencies
        run: pip install platformio==6.2.0 pillow

      - name: Pre-release verification gate
        run: |
          python tools/build_web_gz.py
          python test/verify_zoogotchi_suite.py

      - name: Build firmware & LittleFS
        run: |
          pio run -e waveshare_s3_169
          pio run -e waveshare_s3_169 -t buildfs
          cp .pio/build/waveshare_s3_169/firmware.bin .pio/build/waveshare_s3_169/zoogotchi-s3.bin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          files: |
            .pio/build/waveshare_s3_169/zoogotchi-s3.bin
            .pio/build/waveshare_s3_169/littlefs.bin
          generate_release_notes: true
