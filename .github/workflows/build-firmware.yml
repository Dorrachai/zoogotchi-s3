name: Build Firmware

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "web_ui/**"
      - "tools/**"
      - "test/**"
      - "data/**"
      - "llm_training/**"
      - "platformio.ini"
      - "partitions_16M.csv"
      - ".github/workflows/build-firmware.yml"
  pull_request:
    paths:
      - "src/**"
      - "include/**"
      - "web_ui/**"
      - "tools/**"
      - "test/**"
      - "data/**"
      - "llm_training/**"
      - "platformio.ini"
      - "partitions_16M.csv"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: platformio-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build & verification dependencies
        run: pip install platformio==6.2.0 pillow

      - name: Rebuild Web UI & RAG index + run verification suite
        run: |
          python tools/build_web_gz.py
          python tools/build_rag_index.py
          python llm_training/data_pipeline/curate_dataset.py
          python test/verify_zoogotchi_suite.py
          python llm_training/generate_zoo_dataset.py --dry-run --per-species 64
          python tools/generate_study_deck.py --topic "NeetCode 150" --dry-run
          python tools/generate_zoo_sprites.py --dry-run --missing-only

      - name: Build firmware & filesystem
        run: |
          pio run -e waveshare_s3_169
          pio run -e waveshare_s3_169 -t buildfs
          cp .pio/build/waveshare_s3_169/firmware.bin .pio/build/waveshare_s3_169/zoogotchi-s3.bin

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zoogotchi-s3-firmware
          path: |
            .pio/build/waveshare_s3_169/zoogotchi-s3.bin
            .pio/build/waveshare_s3_169/littlefs.bin
          retention-days: 30
